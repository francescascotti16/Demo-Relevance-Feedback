<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>Visione Relevance Feedback</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.0/jquery.min.js"></script>
</head>
<body>
    <div id="page">

        
        <div style="position: absolute; top: 10px; left: 20px; z-index: 1000;">
            <a href="https://github.com/francescascotti16/Demo-Relevance-Feedback" target="_blank" title="View on GitHub">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" 
                     alt="GitHub" 
                     width="32" 
                     height="32"
                     style="cursor: pointer;">

    <div id="menu" >

    <div id="button-container" class="button-container" style="display:block;">
       
        <div class="button-row">
            <input type="text" maxlength="100" id="query" name="query" class="query-container" placeholder="Enter your query here">
            <button id="search-update-button" class="save-button" onclick="handleSearchOrUpdate()">Search</button>

           
        </div>


       
        <div id="loading" style="display:none;">
            <div class="spinner"></div>
        </div>
        <div class="action-columns">
       
        <div class="column">
            <select id="algorithm-select" class="dropbtn">
            <option disabled selected>Select an algorithm or compare all</option>
            <option value="Rocchio">Rocchio</option>
            <option value="PicHunter">PicHunter</option>
            <option value="PicHunter-star">PicHunter-star</option>

            <option value="Polyadic-SED">Polyadic-SED</option>
            <option value="Polyadic-MSED">Polyadic-MSED</option>

            </select>
            
            
            <button class="clear-button" onclick="clearPage()">Clear ↺</button>

        </div>
            
        </div>

                <div id="images-container" class="images-container">
                 
                    <div id="liked-images-container">
                        <h3>
                            Liked Images
                            <svg width="72" height="72" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path fill="green" d="M2 21h4V9H2v12zM22 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L13.17 1 7.59 6.59C7.22 6.95 7 7.45 7 8v11c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.15-.34.23-.7.23-1.07V10z"/>
                            </svg>
                        </h3>
                        <div id="liked-images" class="positive-images-container"></div>
                    </div>
                
                   
                    <div id="disliked-images-container">
                        <h4>
                            Disliked Images
                            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path fill="red" d="M15 3H6c-.83 0-1.54.5-1.84 1.22L1.02 11.3c-.12.27-.19.57-.19.88V15c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L10.83 23l5.58-5.59c.37-.36.59-.86.59-1.41V5c0-1.1-.9-2-2-2z"/>
                            </svg>

            <div id="time-of-search" style="text-align: center; margin-top: 20px; font-weight: bold; font-size: 20px; color: #2196F3;">

        <div id="content">
            <content-title  id="content-title" class="content-title" ></content-title >
            <div id="image-container"></div>
            <div id="results"></div>
            <div id="selected-results" class="hidden"></div>
        </div>


    </div>
 
    <div id="custom-alert" style="display:none;">
    <div id="custom-alert-box" role="alertdialog" aria-modal="true" aria-labelledby="custom-alert-message">
        <button id="custom-alert-close" class="alert-close" aria-label="Exit">×</button>
        <p id="custom-alert-message"></p>
    </div>
    </div>
    <script>
        function toggleInfoMessage() {
          var infoMessage = document.getElementById("info-message");
          if (infoMessage.style.display === "none" || infoMessage.style.display === "") {
            infoMessage.style.display = "block";
          } else {
            infoMessage.style.display = "none";
          }
        }
      </script>

</body>

    

    <script>
       let initialResults = { urls: [], ids: [] };
       const INITIAL_RESULTS_MAX = 300; 

          
        let selectedImageURLs = {};
        let hasSearched = false;

        //let allImageURLs = {};
        let relevantImages = [];
        let nonRelevantImages = [];
        let relevantImagestemp = [];
        let nonRelevantImagestemp = [];
        let sessionId = null;
        let svmWarnedOnlyPositives = false; 

     
        let alertAutoHideTimer = null;
        function setContentTitle(text) {
            const h = document.getElementById("content-title");
            if (!h) return;
            if (text && text.trim()) {
                h.textContent = text;
                h.style.display = "block";
            } else {
                h.textContent = "";
                h.style.display = "none";
            }
            }

          
            const HUMAN_ALGO = {
            'rocchio': 'Rocchio',
            'pichunter': 'PicHunter',
            'pichunter-star': 'PicHunter-star',
            'svm': 'SVM',
            'polyadic-sed': 'Polyadic-SED',
            'polyadic-msed': 'Polyadic-MSED',
            'compare all': 'Compare All'
            };

        function showAlert(message, {variant = "info", autoHideMs = 15000} = {}) {
        const overlay = document.getElementById("custom-alert");
        const box = document.getElementById("custom-alert-box");
        const msg = document.getElementById("custom-alert-message");
        const closeBtn = document.getElementById("custom-alert-close");

       
        box.classList.remove("alert--info","alert--warning","alert--error","alert--success");
        box.classList.add(`alert--${variant}`);

        msg.textContent = message;
        overlay.style.display = "flex";

       
        if (alertAutoHideTimer) {
            clearTimeout(alertAutoHideTimer);
            alertAutoHideTimer = null;
        }
        if (autoHideMs && autoHideMs > 0) {
            alertAutoHideTimer = setTimeout(hideAlert, autoHideMs);
        }

       
        closeBtn.onclick = hideAlert;
        overlay.onclick = (e) => {
        
            if (e.target === overlay) hideAlert();
        };

        document.addEventListener("keydown", escCloser);
        }

        function hideAlert() {
        const overlay = document.getElementById("custom-alert");
        overlay.style.display = "none";
        if (alertAutoHideTimer) {
            clearTimeout(alertAutoHideTimer);
            alertAutoHideTimer = null;
        }
        document.removeEventListener("keydown", escCloser);
        }

        function escCloser(e) {
        if (e.key === "Escape") hideAlert();
        }

    


        function handleSearchOrUpdate() {
            if (!hasSearched) {
                submitQuery(); 
                hasSearched = true;
                const btn = document.getElementById("search-update-button");
                btn.textContent = "Update";
                btn.onclick = saveAndUpdate; 
            } else {
                saveAndUpdate(); 
            }
        }


        function createImageWithThumbs(containerDiv, url, id) { 
            const imgDiv = document.createElement("div");
            imgDiv.className = "image-item"; 
        
            const thumbsDiv = document.createElement("div");
            thumbsDiv.className = "thumbs-buttons";
            createImageWithThumbs._uid = createImageWithThumbs._uid || 0;

            // "Thumbs Up"
            const thumbsUpBtn = document.createElement("button");
            thumbsUpBtn.className = "thumbs-up";
            const svgUp = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svgUp.setAttribute("width", "72");
            svgUp.setAttribute("height", "72");
            svgUp.setAttribute("viewBox", "0 0 24 24");
            const pathUp = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathUp.setAttribute("fill", "green");
            pathUp.setAttribute("d", "M2 21h4V9H2v12zM22 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L13.17 1 7.59 6.59C7.22 6.95 7 7.45 7 8v11c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.15-.34.23-.7.23-1.07V10z");
            svgUp.appendChild(pathUp);
            thumbsUpBtn.appendChild(svgUp);
            thumbsUpBtn.onclick = function() {
                handleThumbsUp(url, id);
            };
        
            // "Thumbs Down"
            const thumbsDownBtn = document.createElement("button");
            thumbsDownBtn.className = "thumbs-down";
            const svgDown = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svgDown.setAttribute("width", "24");
            svgDown.setAttribute("height", "24");
            svgDown.setAttribute("viewBox", "0 0 24 24");
            const pathDown = document.createElementNS("http://www.w3.org/2000/svg", "path");
            pathDown.setAttribute("fill", "red");
            pathDown.setAttribute("d", "M15 3H6c-.83 0-1.54.5-1.84 1.22L1.02 11.3c-.12.27-.19.57-.19.88V15c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L10.83 23l5.58-5.59c.37-.36.59-.86.59-1.41V5c0-1.1-.9-2-2-2z");
            svgDown.appendChild(pathDown);
            thumbsDownBtn.appendChild(svgDown);
            thumbsDownBtn.onclick = function() {
                handleThumbsDown(url, id);
            };
        
            thumbsDiv.appendChild(thumbsUpBtn);
            thumbsDiv.appendChild(thumbsDownBtn);
           
            const span = document.createElement("span");
            span.className = 'fancychecks';
            
            const img = document.createElement("img");
            img.src = url;
            const uid = ++createImageWithThumbs._uid;
            img.id = `image_${id}_${uid}`;
         
            img.setAttribute('data-img-id', String(id));
          
            // Zoom
            img.onclick = function() {
                img.classList.toggle('zoomed2'); 
            };
           
            span.appendChild(img);
            
            if (relevantImages.includes(id)) {
                span.style.boxShadow = "0 0 0 2px white inset, 0 0 0 3px green";
                } else if (nonRelevantImages.includes(id)) {
                span.style.boxShadow = "0 0 0 2px white inset, 0 0 0 3px red";
                } else {
                span.style.boxShadow = "";
}


            
            imgDiv.appendChild(span);
            imgDiv.appendChild(thumbsDiv);
            
            
          //   const idLabel = document.createElement("div");
          //   idLabel.className = "image-id-label";
          //   idLabel.style.fontSize = "10px";
          //   idLabel.style.textAlign = "center";
           //  idLabel.style.marginTop = "-5px"; 
           //  idLabel.textContent = "ID: " + id;
   
           //  imgDiv.appendChild(idLabel);
            
            containerDiv.appendChild(imgDiv);
        }
        
        
        
       function addPositiveBorder(id) {
        setBorderForAllInstances(id, 'green');
        }

        function addNegativeBorder(id) {
        setBorderForAllInstances(id, 'red');
        }
        function renderInitialResultsBox(parentGrid) {
            if (!initialResults.urls || initialResults.urls.length === 0) return;

            const box = document.createElement("div");
            box.className = "method-box method-box--initial"; 

            const title = document.createElement("h2");
            title.textContent = "INITIAL RESULTS";
        
            box.appendChild(title);

            const imagesDiv = document.createElement("div");
            imagesDiv.className = "method-images";

            const maxN = Math.min(INITIAL_RESULTS_MAX, initialResults.urls.length);
            for (let i = 0; i < maxN; i++) {
                createImageWithThumbs(imagesDiv, initialResults.urls[i], initialResults.ids[i]);
            }

            box.appendChild(imagesDiv);
            parentGrid.appendChild(box); 
            }



        
        
        function submitQuery() {
            
            const loadingDiv = document.getElementById("loading");
            loadingDiv.style.display = "block";
        
            const query = document.getElementById("query").value;
            const resultsDiv = document.getElementById("results");
            
            resultsDiv.innerHTML = '';
            const selectedResultsDiv = document.getElementById("selected-results");
            
            selectedResultsDiv.innerHTML = '';
            selectedResultsDiv.classList.add("hidden");
            resultsDiv.classList.remove("hidden");
            document.getElementById("liked-images").innerHTML = '';
            document.getElementById("disliked-images").innerHTML = '';
            document.getElementById("button-container").style.display = "block";
        
        
            relevantImages = [];
            nonRelevantImages = [];
            relevantImagestemp = [];
            nonRelevantImagestemp = [];
            selectedImageURLs = {}; 
                    
            fetch('/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query: query })
            })
            .then(response => response.json())
            .then(data => {
                loadingDiv.style.display = "none";

         
                sessionId = data.session_id;
              
                initialResults.urls = data.image_urls || [];
                initialResults.ids  = data.img_ids    || [];

                const containerDiv = document.createElement("div");
                containerDiv.className = "image-container";
                resultsDiv.appendChild(containerDiv);

                data.image_urls.forEach((url, idx) => {
                    createImageWithThumbs(containerDiv, url, data.img_ids[idx]);
                });
            })
            .catch(error => {
                loadingDiv.style.display = "none";
                console.error('Error: ', error );
            });
        }

      
        
        
    
    function removeSelectedImage(id, containerId) {
  
    if (containerId === "liked-images") {
        relevantImages = relevantImages.filter(i => i !== id);
        relevantImagestemp = relevantImagestemp.filter(i => i !== id);
    } else if (containerId === "disliked-images") {
        nonRelevantImages = nonRelevantImages.filter(i => i !== id);
        nonRelevantImagestemp = nonRelevantImagestemp.filter(i => i !== id);
    }

   
    delete selectedImageURLs[id];

    setBorderForAllInstances(id, null);

    
    const wrapper = document.getElementById(`container-image-${id}`)?.parentElement;
    if (wrapper) wrapper.remove();

  
    if (typeof updateLikedDislikedVisibility === "function") {
        updateLikedDislikedVisibility();
    }
    }


        
        function addImageToContainer(url, id, containerId) {
            const container = document.getElementById(containerId);
            const wrapper = document.createElement("div");
            wrapper.className = "container-image-wrapper";
            wrapper.style.position = "relative";
            wrapper.style.display = "inline-block";
            wrapper.style.margin = "5px";

            const img = document.createElement("img");
            img.src = url;
            img.id = `container-image-${id}`;
            img.className = "styled-image zoomable";
            img.onclick = () => img.classList.toggle("zoomed2");

            const closeBtn = document.createElement("span");
            closeBtn.className = "close-btn";
            closeBtn.textContent = "×";
            closeBtn.style.position = "absolute";
            closeBtn.style.top = "0";
            closeBtn.style.right = "0";
            closeBtn.style.cursor = "pointer";
            closeBtn.style.backgroundColor = "#ffcccc";
            closeBtn.style.border = "1px solid #ff6666";
            closeBtn.style.borderRadius = "50%";
            closeBtn.style.padding = "2px 5px";
            closeBtn.style.fontSize = "12px";
            closeBtn.style.zIndex = "10";
            closeBtn.style.color = "#cc0000";
            closeBtn.onclick = e => {
                e.stopPropagation();
                removeSelectedImage(id, containerId);
            };

            wrapper.appendChild(img);
            wrapper.appendChild(closeBtn);
            container.appendChild(wrapper);
        }

    
        function handleThumbsUp(url, id) {
           
            if (nonRelevantImages.includes(id)) {
                removeFromNonRelevant(id);
                removeImageFromContainer(id, "disliked-images");
                addPositiveBorder(id);
            }

            if (!relevantImages.includes(id)) {
            
                relevantImages.push(id);
                relevantImagestemp.push(id);
                selectedImageURLs[id] = url;
                addPositiveBorder(id);
                addImageToContainer(url, id, "liked-images");
            } else {
               
                removeSelectedImage(id, "liked-images");
            }
        }

     
        function handleThumbsDown(url, id) {
           
            if (relevantImages.includes(id)) {
                removeFromRelevant(id);
                removeImageFromContainer(id, "liked-images");
                addNegativeBorder(id);
            }

            if (!nonRelevantImages.includes(id)) {
             
                nonRelevantImages.push(id);
                nonRelevantImagestemp.push(id);
                selectedImageURLs[id] = url;
                addNegativeBorder(id);
                addImageToContainer(url, id, "disliked-images");
            } else {
              
                removeSelectedImage(id, "disliked-images");
            }
        }

      
       
        function removeFromRelevant(id) {
        relevantImages = relevantImages.filter(i => i !== id);
        relevantImagestemp = relevantImagestemp.filter(i => i !== id);
        delete selectedImageURLs[id];
        setBorderForAllInstances(id, null);
        updateLikedDislikedVisibility?.();
        }

        function removeFromNonRelevant(id) {
        nonRelevantImages = nonRelevantImages.filter(i => i !== id);
        nonRelevantImagestemp = nonRelevantImagestemp.filter(i => i !== id);
        delete selectedImageURLs[id];
        setBorderForAllInstances(id, null);
        updateLikedDislikedVisibility?.();
        }

            
        function removeImageFromContainer(id, containerId) {
            const container = document.getElementById(containerId);
            const img = document.getElementById(`container-image-${id}`);
            
            if (img) {
                container.removeChild(img);
            }
        }
                
       
       
        


       function saveAndDisplayallMethods() {
           
   
            const loadingDiv = document.getElementById("loading");
            loadingDiv.style.display = "block";

       
            document.getElementById("image-container").innerHTML = "";
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";
            resultsDiv.classList.add("hidden");
            const selectedDiv = document.getElementById("selected-results");
            selectedDiv.innerHTML = "";
         
            const onlyNegatives = (relevantImages.length === 0 && nonRelevantImages.length > 0);
            if (onlyNegatives) {
            showAlert(
                "Compare All: you have selected only negative items. SVM and PicHunter are not compatible with only negatives and will be excluded from the comparison. Polyadic was not originally design to work with only negative feedback, so please be aware that results may be low quality",
                { variant: "warning", autoHideMs: 15000 }
            );
            }
                       
            const onlyPositives = (relevantImages.length > 0 && nonRelevantImages.length === 0);
            if (onlyPositives && !window._svmWarnedOnlyPositivesCompareAll) {
            showAlert(
                "You have selected only positive items. In SVM, 10 random negative items will be automatically added for training. Pichunter and Piuchunter-star will show the same results.",
                { variant: "warning", autoHideMs: 7000 }
            );
            window._svmWarnedOnlyPositivesCompareAll = true;
            }

           
            fetch('/compare_all_methods', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: sessionId,
                    relevant_images_ids: relevantImages,
                    non_relevant_images_ids: nonRelevantImages
                })
            })
            .then(r => r.json())
            .then(data => {
                loadingDiv.style.display = "none";
                if (data.status !== 'success') {
                    return alert("Error during comparison.");
                }
                renderAllMethodsComparison(data.comparisons);
            })
            .catch(error => {
                loadingDiv.style.display = "none";
                console.error('Error:', error);

                showAlert(
                "SVM does not support only negative feedback. Please select both positive and negative images before updating results.",
                { variant: "error", autoHideMs: 15000 }
                );


                setTimeout(() => {
                    alertBox.style.display = "none";
                }, 15000);
            });
        }
        function renderAllMethodsComparison(comparisons) {
            const container = document.getElementById("selected-results");
            container.innerHTML = "";
            container.classList.remove("hidden");
            container.style.display = "block";

            const methodOrder = ['rocchio','pichunter','pichunter-star','svm','polyadic-sed','polyadic-msed'];

            
            const shown = methodOrder.filter(m => comparisons[m]).map(m => HUMAN_ALGO[m] || m);
            setContentTitle(`Compare All`);

            const grid = document.createElement("div");
            grid.className = "all-methods-container";
         
            renderInitialResultsBox(grid);

            methodOrder.forEach(method => {
                const res = comparisons[method];
                if (!res) return;
                const box = document.createElement("div");
                box.className = "method-box";

                const title = document.createElement("h2");
                title.textContent = (HUMAN_ALGO[method] || method).toUpperCase() + ` (${res.time})`;
                box.appendChild(title);

                const imagesDiv = document.createElement("div");
                imagesDiv.className = "method-images";
                res.urls.forEach((url, i) => createImageWithThumbs(imagesDiv, url, res.ids[i]));
                box.appendChild(imagesDiv);

                grid.appendChild(box);
            });

            container.appendChild(grid);
            grid.scrollLeft = 0;
            container.scrollLeft = 0;
            window.scrollTo({ top: 0, behavior: "smooth" });
            }


        function updateLikedDislikedVisibility() {
            const liked = document.getElementById("liked-images");
            const disliked = document.getElementById("disliked-images");

            const likedContainer = document.getElementById("liked-images-container");
            const dislikedContainer = document.getElementById("disliked-images-container");

            likedContainer.style.display = liked.children.length > 0 ? "block" : "none";
            dislikedContainer.style.display = disliked.children.length > 0 ? "block" : "none";
}

        function saveAndUpdate() {
            const sel = document.getElementById("algorithm-select");
            const selectedAlgorithm = sel.value.toLowerCase();

            if (sel.selectedIndex === 0) {
                showAlert(
                    "Please select an algorithm before updating results.",
                    { variant: "warning", autoHideMs: 15000 }
                );
                return;
            }

            setContentTitle(HUMAN_ALGO[selectedAlgorithm] || selectedAlgorithm);

            const loadingDiv = document.getElementById("loading");
            loadingDiv.style.display = "block";

            // Caso speciale: Compare All
            if (selectedAlgorithm === "compare all") {
                saveAndDisplayallMethods();
                return;
            }

            // PicHunter non supporta negativi
            if (selectedAlgorithm === "pichunter" && nonRelevantImages.length > 0) {
                showAlert(
                    "PicHunter: negative feedback is not supported. Please select only positive images before updating the results.",
                    { variant: "warning", autoHideMs: 15000 }
                );
                loadingDiv.style.display = "none";
                return;
            }

            // SVM con solo positivi
            if (
                selectedAlgorithm === "svm" &&
                relevantImages.length > 0 &&
                nonRelevantImages.length === 0 &&
                !svmWarnedOnlyPositives
            ) {
                showAlert(
                    "SVM: you have selected only positive items. 10 random negative items will be automatically added for training.",
                    { variant: "warning", autoHideMs: 15000 }
                );
                svmWarnedOnlyPositives = true;
            }

            // Polyadic con solo negativi
            const onlyNegatives = (relevantImages.length === 0 && nonRelevantImages.length > 0);
            if ((selectedAlgorithm === "polyadic-sed" || selectedAlgorithm === "polyadic-msed") && onlyNegatives) {
                showAlert(
                    `You have selected only negative items. This method was not originally designed to work with only negative feedback, so please be aware that results may be of low quality.`,
                    { variant: "warning", autoHideMs: 15000 }
                );
            }

            // Chiamata al backend
            fetch('/save_and_update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    relevant_images_ids: relevantImages,
                    non_relevant_images_ids: nonRelevantImages,
                    relevant_images_ids_temp: relevantImagestemp,
                    non_relevant_images_ids_temp: nonRelevantImagestemp,
                    selected_algorithm: selectedAlgorithm,
                    session_id: sessionId
                })
            })
                .then(resp => {
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    return resp.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        displayUpdatedImages(data);
                        document.getElementById("time-of-search").textContent =
                            `${data.selected_algorithm} Time: ${data.total_time}`;
                        relevantImagestemp = [];
                        nonRelevantImagestemp = [];

                        setContentTitle(HUMAN_ALGO[data.selected_algorithm] || data.selected_algorithm);
                    } else {
                        showAlert("Update failed: backend returned an error.", { variant: "error", autoHideMs: 15000 });
                    }
                })
                .catch(err => {
                    console.error('Update error:', err);
                    showAlert(
                        "Error during update. Please check that the algorithm supports your selection of positives/negatives.",
                        { variant: "error", autoHideMs: 15000 }
                    );
                })
                .finally(() => {
                    // Nascondi lo spinner SEMPRE
                    loadingDiv.style.display = "none";
                });
        }


        function setBorderForAllInstances(id, color /* 'green' | 'red' | null */) {
        const sel = `img[data-img-id="${CSS.escape(String(id))}"]`;
        document.querySelectorAll(sel).forEach(img => {
            const span = img.parentElement; 
            if (!span) return;
            if (color === 'green') {
            span.style.boxShadow = "0 0 0 2px white inset, 0 0 0 5px green";
            } else if (color === 'red') {
            span.style.boxShadow = "0 0 0 2px white inset, 0 0 0 5px red";
            } else {
            span.style.boxShadow = "";
            }
        });
        }

        function displayUpdatedImages(data) {
         
            const resultsDiv = document.getElementById("results");
            if (resultsDiv) {
                resultsDiv.innerHTML = '';
            }
            
   
            const selectedDiv = document.getElementById("selected-results");
            selectedDiv.innerHTML = '';
            
           
            const containerDiv = document.createElement("div");
            containerDiv.className = "image-container";
            selectedDiv.appendChild(containerDiv);
            
            if (data.new_image_urls && data.new_image_urls.length > 0) {
                data.new_image_urls.forEach((url, idx) => {
                    createImageWithThumbs(containerDiv, url, data.new_image_ids[idx]);
                });
            }
            
            
            selectedDiv.classList.remove("hidden");
     
            document.getElementById("content").scrollTop = 0;
            setContentTitle(HUMAN_ALGO[data.selected_algorithm] || data.selected_algorithm);

           
            setTimeout(() => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            }, 100);
        }
        
        function setSelectedAlgorithm(algorithm) {
            localStorage.setItem('selectedAlgorithm', algorithm);
        }

       
        function getSelectedAlgorithm() {
            return localStorage.getItem('selectedAlgorithm');
        }
        function clearPage() {
          
            document.getElementById("query").value = "";

           
            const algoSelect = document.getElementById("algorithm-select");
            if (algoSelect) algoSelect.selectedIndex = 0;

           
            document.getElementById("image-container").innerHTML = "";
            document.getElementById("results").innerHTML = "";
            document.getElementById("selected-results").innerHTML = "";
            document.getElementById("liked-images").innerHTML = "";
            document.getElementById("disliked-images").innerHTML = "";
            document.getElementById("time-of-search").textContent = "";

          
            setContentTitle("");  

            
            document.getElementById("selected-results").classList.add("hidden");

            relevantImages = [];
            nonRelevantImages = [];
            relevantImagestemp = [];
            nonRelevantImagestemp = [];
            selectedImageURLs = {};
            sessionId = null;
            initialResults = { urls: [], ids: [] };

        
            document.getElementById("loading").style.display = "none";

         
            const button = document.getElementById("search-update-button");
            button.textContent = "Search";
            button.onclick = handleSearchOrUpdate;
            hasSearched = false;
}


        
    </script>
</body>
